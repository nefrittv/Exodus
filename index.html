
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Великий Исход | Старостат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Crimson Pro', serif;
            background-color: #f4f1ea;
            color: #2c2c2c;
        }
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }
        .parchment {
            background-color: #fdfbf7;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.03;
            background-image: url('https://www.transparenttextures.com/patterns/felt.png');
        }
    </style>
        <!-- React/DOM UMD для прямого запуска через file:// -->
        <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
        <!-- Babel Standalone, чтобы на лету транспилировать JSX из этого файла -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <div class="grain-overlay"></div>
<script type="text/babel" data-presets="env,react">
    // Простейший вывод ошибок прямо на странице, чтобы увидеть причину белого экрана
    const showError = (msg) => {
        const box = document.createElement('div');
        box.style.position = 'fixed';
        box.style.bottom = '16px';
        box.style.left = '16px';
        box.style.zIndex = '9999';
        box.style.padding = '12px 16px';
        box.style.background = '#fee2e2';
        box.style.color = '#7f1d1d';
        box.style.border = '1px solid #fecaca';
        box.style.borderRadius = '8px';
        box.style.fontFamily = 'monospace';
        box.textContent = `Ошибка: ${msg}`;
        document.body.appendChild(box);
    };
    window.addEventListener('error', (e) => showError(e.message));
    window.addEventListener('unhandledrejection', (e) => showError(e.reason?.message || e.reason || 'Unhandled rejection'));

    if (!window.React || !window.ReactDOM) {
        showError('React не загрузился');
    }

    const { useState, useMemo } = React;
    // Убрали зависимость от Recharts, делаем простые SVG визуализации

    const View = {
        INTRO: 'INTRO',
        CALHOUN: 'CALHOUN',
        DUNBAR: 'DUNBAR',
        ECONOMY: 'ECONOMY',
        MAP: 'MAP',
        TRANSITION: 'TRANSITION',
        NATURE: 'NATURE',
        WISDOM: 'WISDOM'
    };

    const Navigation = ({ currentView, setView }) => {
        const links = [
            { id: View.INTRO, label: 'Начало', icon: '📜' },
            { id: View.CALHOUN, label: 'Клоака', icon: '🏙️' },
            { id: View.DUNBAR, label: 'Община', icon: '👥' },
            { id: View.ECONOMY, label: 'Уклад', icon: '🌾' },
            { id: View.MAP, label: 'Поселение', icon: '🏡' },
            { id: View.TRANSITION, label: 'Переход', icon: '🛤️' },
            { id: View.NATURE, label: 'Природа', icon: '🌿' },
            { id: View.WISDOM, label: 'Мудрость', icon: '👴' },
        ];

        return (
            <nav className="fixed bottom-0 left-0 w-full md:relative md:bottom-auto bg-stone-50/90 backdrop-blur-md border-t md:border-t-0 md:bg-transparent border-stone-200 z-50">
                <div className="flex overflow-x-auto no-scrollbar md:overflow-visible py-2 px-4 space-x-2 md:space-x-4 justify-start md:justify-end items-center">
                    {links.map((link) => (
                        <button
                            key={link.id}
                            onClick={() => setView(link.id)}
                            className={`flex flex-col md:flex-row items-center space-y-1 md:space-y-0 md:space-x-2 px-3 py-2 rounded-xl transition-all whitespace-nowrap ${
                                currentView === link.id 
                                    ? 'bg-stone-900 text-white shadow-lg scale-105' 
                                    : 'text-stone-500 hover:text-stone-800 hover:bg-stone-200/50'
                            }`}
                        >
                            <span className="text-lg md:text-sm">{link.icon}</span>
                            <span className="text-[10px] md:text-[11px] font-bold uppercase tracking-widest">
                                {link.label}
                            </span>
                        </button>
                    ))}
                </div>
            </nav>
        );
    };

    const Intro = ({ onNext }) => (
        <div className="flex flex-col items-center justify-center text-center space-y-8 md:space-y-12 animate-in fade-in slide-in-from-bottom-4 duration-1000">
            <div className="max-w-2xl space-y-6 md:space-y-8">
                <h2 className="text-4xl md:text-7xl font-serif text-stone-900 leading-tight">
                    Мир, где правда в глазах соседа.
                </h2>
                <div className="h-px w-24 bg-stone-300 mx-auto"></div>
                <p className="text-lg md:text-2xl text-stone-600 leading-relaxed font-light italic px-4">
                    "Путь к свободе лежит через возделанный сад."
                </p>
            </div>
            <button 
                onClick={onNext}
                className="px-8 md:px-10 py-3 md:py-4 bg-stone-900 text-white rounded-full hover:bg-stone-800 transition-all transform hover:scale-105 uppercase tracking-widest text-xs md:text-sm font-bold shadow-xl"
            >
                Начать Исход
            </button>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-8 mt-8 md:mt-12 text-left px-4">
                <div className="p-6 border border-stone-200 bg-stone-50/50 rounded-2xl">
                    <h3 className="font-bold text-stone-800 mb-2 uppercase text-[10px] tracking-tighter">Личный Суверенитет</h3>
                    <p className="text-stone-500 text-xs">Независимость от централизованных систем через собственное производство и аскезу.</p>
                </div>
                <div className="p-6 border border-stone-200 bg-stone-50/50 rounded-2xl">
                    <h3 className="font-bold text-stone-800 mb-2 uppercase text-[10px] tracking-tighter">Власть Опыта</h3>
                    <p className="text-stone-500 text-xs">Старостат как естественная иерархия уважения, а не принуждения.</p>
                </div>
                <div className="p-6 border border-stone-200 bg-stone-50/50 rounded-2xl">
                    <h3 className="font-bold text-stone-800 mb-2 uppercase text-[10px] tracking-tighter">Тихий Саботаж</h3>
                    <p className="text-stone-500 text-xs">Отказ кормить Левиафана своим вниманием и своими ресурсами.</p>
                </div>
            </div>
        </div>
    );

    const CalhounView = () => {
        const [density, setDensity] = useState(20);
        const generateData = (count) => Array.from({ length: count }, (_, i) => ({
            x: Math.random() * 100,
            y: Math.random() * 100,
            z: 5 + Math.random() * 10,
            id: i
        }));
        const data = generateData(density);
        const infernoLevel = density >= 240 ? 'АД' : density >= 140 ? 'Пекло' : density >= 80 ? 'Жар' : 'Норма';

        return (
            <div className="space-y-8 animate-in fade-in duration-700">
                <div className="max-w-3xl">
                    <h2 className="text-4xl font-serif text-stone-900 mb-6 italic">Вселенная 25: Токсичная чашка Петри</h2>
                    <p className="text-lg text-stone-700 leading-relaxed mb-4">
                        Современные мегаполисы — это и есть загон Калхуна. Скученность и избыток социальных контактов неизбежно приводят популяцию к «поведенческой клоаке», отказу от размножения и вымиранию.
                    </p>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                    <div className={`p-8 rounded-2xl border shadow-inner ${density >= 200 ? 'bg-red-50/70 border-red-200' : 'bg-stone-100 border-stone-200'}`}>
                        <h3 className="text-sm uppercase tracking-widest text-stone-500 mb-2">Визуализация плотности контактов</h3>
                        <div className="min-h-[320px] w-full relative overflow-hidden rounded-xl">
                            <div className="absolute inset-0" style={{
                                background: `radial-gradient(circle at 50% 50%, rgba(127,29,29,${Math.min(0.55, density/260)}), transparent 65%)`,
                                pointerEvents: 'none'
                            }}></div>
                            <svg viewBox="0 0 100 100" className="w-full h-[320px] bg-stone-200/40 rounded-xl border border-stone-200">
                                {data.map((pt) => (
                                    <circle key={pt.id} cx={pt.x} cy={pt.y} r={pt.z / 8}
                                        fill={density > 180 ? '#991b1b' : density > 100 ? '#b45309' : '#44403c'} fillOpacity="0.72" />
                                ))}
                                <rect x="5" y="5" width="90" height="90" fill="none" stroke="#d6d3d1" strokeDasharray="4 4" />
                                {density >= 220 && (
                                    <text x="50" y="52" textAnchor="middle" fill="#7f1d1d" fontSize="10" fontWeight="bold">АД</text>
                                )}
                            </svg>
                        </div>
                        <div className="mt-8 space-y-3">
                            <label className="text-sm font-bold text-stone-700 flex justify-between">
                                <span>Плотность населения</span>
                                <span>{infernoLevel}</span>
                            </label>
                            <input 
                                type="range" min="5" max="300" value={density}
                                onChange={(e) => setDensity(parseInt(e.target.value, 10))}
                                className="w-full h-2 bg-stone-300 rounded-lg appearance-none cursor-pointer accent-red-700"
                            />
                        </div>
                    </div>
                    <div className="space-y-6">
                        <div className={`p-6 border-l-4 transition-colors duration-500 ${density > 100 ? 'border-red-900 bg-red-50' : 'border-stone-800 bg-stone-50'}`}>
                            <h4 className="font-bold text-stone-800 mb-2 font-serif">Последствия скученности:</h4>
                            <ul className="list-disc list-inside text-stone-600 space-y-2 text-sm italic">
                                <li>Потеря социальных навыков</li>
                                <li>Гипер-агрессия без повода</li>
                                <li>Отказ от заботы о потомстве</li>
                                <li>Уход в виртуальные симуляции</li>
                                <li>Окончательное вымирание при полном достатке</li>
                            </ul>
                        </div>
                        <p className="text-stone-500 italic text-sm font-serif">
                            Мы теряем рассудок не из-за голода, а из-за бесконечного шума чужих жизней.
                        </p>
                    </div>
                </div>
            </div>
        );
    };

    const DunbarView = () => {
        const data = [
            { name: 'Близкие связи', value: 5, color: '#1c1917' },
            { name: 'Друзья', value: 15, color: '#44403c' },
            { name: 'Знакомые', value: 50, color: '#78716c' },
            { name: 'Когнитивный предел (Община)', value: 80, color: '#a8a29e' },
        ];

        return (
            <div className="space-y-12 animate-in fade-in duration-700">
                <div className="max-w-3xl">
                    <h2 className="text-4xl font-serif text-stone-900 mb-6 italic">150: Предел человечности</h2>
                    <p className="text-lg text-stone-700 leading-relaxed mb-4">
                        Антрополог Робин Данбар установил когнитивный предел социальных связей. Все, что выходит за рамки общины в 150 человек, превращается в безликую массу, управляемую только страхом или ложью.
                    </p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                    <div className="min-h-[220px] w-full flex flex-col items-center">
                        <div className="w-full space-y-3">
                            {data.map((item) => (
                                <div key={item.name} className="flex items-center gap-3">
                                    <div className="w-16 text-[11px] uppercase tracking-tight text-stone-500">{item.name}</div>
                                    <div className="flex-1 h-3 rounded-full bg-stone-200 overflow-hidden">
                                        <div className="h-full" style={{ width: `${item.value / 80 * 100}%`, backgroundColor: item.color }}></div>
                                    </div>
                                    <div className="w-10 text-right text-xs text-stone-600 font-mono">{item.value}</div>
                                </div>
                            ))}
                        </div>
                        <div className="text-center mt-6">
                            <span className="text-3xl font-serif font-bold text-stone-800">Σ = 150</span>
                            <p className="text-xs text-stone-400 uppercase tracking-widest font-serif">Максимальный размер общины</p>
                        </div>
                    </div>
                    <div className="space-y-8 font-serif">
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-stone-100">
                            <h4 className="text-stone-900 font-bold mb-3 italic">Почему это важно?</h4>
                            <div className="space-y-4">
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 shrink-0 bg-stone-800 text-white flex items-center justify-center rounded-full font-serif italic text-lg">1</div>
                                    <p className="text-stone-600 text-sm italic leading-snug">В общине такого размера невозможна анонимная подлость. Репутация — единственный капитал.</p>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 shrink-0 bg-stone-800 text-white flex items-center justify-center rounded-full font-serif italic text-lg">2</div>
                                    <p className="text-stone-600 text-sm italic leading-snug">Отсутствие бюрократии. Решения принимаются в ходе прямого диалога.</p>
                                </div>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 shrink-0 bg-stone-800 text-white flex items-center justify-center rounded-full font-serif italic text-lg">3</div>
                                    <p className="text-stone-600 text-sm italic leading-snug">Биологический резонанс. Наш мозг эволюционировал именно для таких масштабов.</p>
                                </div>
                            </div>
                        </div>
                        <blockquote className="border-l-4 border-stone-300 pl-6 italic text-stone-500 text-xl leading-relaxed">
                            "Идеальная структура будущего — это сеть автономных аграрных поселений, где каждый знает каждого в лицо."
                        </blockquote>
                    </div>
                </div>
            </div>
        );
    };

    const EconomyView = () => {
        const [laborHours, setLaborHours] = useState(8);
        const [consumptionLevel, setConsumptionLevel] = useState(50);
        const autonomyLevel = 100 - consumptionLevel;

        const productionValue = useMemo(() => {
            const fatigueFactor = laborHours > 10 ? 1 - (laborHours - 10) * 0.15 : 1;
            const basicOutput = laborHours * 10;
            const localEfficiency = 0.5 + (autonomyLevel / 100);
            return Math.max(0, Math.floor(basicOutput * localEfficiency * fatigueFactor));
        }, [laborHours, autonomyLevel]);

        const sustainabilityIndex = useMemo(() => {
            const exhaustion = laborHours > 9 ? (laborHours - 9) * 15 : 0;
            const dependencyRisk = consumptionLevel * 0.5;
            return Math.max(5, 100 - exhaustion - dependencyRisk);
        }, [laborHours, consumptionLevel]);

        const radarData = [
            { subject: 'Свобода', A: autonomyLevel, fullMark: 100 },
            { subject: 'Мастерство', A: Math.min(100, (productionValue / 150) * 100), fullMark: 100 },
            { subject: 'Ресурс', A: sustainabilityIndex, fullMark: 100 },
            { subject: 'Покой', A: Math.max(0, 100 - (laborHours * 7)), fullMark: 100 },
            { subject: 'Здоровье', A: 100 - (consumptionLevel * 0.3) - (laborHours > 10 ? 30 : 0), fullMark: 100 },
        ];

        const barData = [
            { name: 'Город', Зависимость: 70, color: '#a8a29e' },
            { name: 'Вы', Зависимость: consumptionLevel, color: '#1c1917' }
        ];

        const getElderAnalysis = () => {
            if (autonomyLevel > 80 && laborHours <= 8) return "Твой дом автономен, твои руки знают дело. Ты не просишь у Левиафана ничего, и он теряет над тобой власть.";
            if (laborHours > 12) return "Ты загоняешь себя как раб на галерах. Рай не строится на износе души. Умерь пыл, вернись к созерцанию.";
            if (consumptionLevel > 70) return "Ты все еще привязан к рынку золотыми цепями. Каждая покупка — это голос за твое собственное рабство.";
            if (autonomyLevel > 50) return "Ты на верном пути. Твоё хозяйство крепнет. Скоро ты забудешь, что такое долги и налоги.";
            return "Ты слишком слаб. Город высасывает твои силы через ненужные желания. Начни с аскезы.";
        };

        return (
            <div className="space-y-8 md:space-y-12 animate-in fade-in duration-700 font-serif pb-24 md:pb-0">
                <div className="max-w-3xl">
                    <h2 className="text-3xl md:text-5xl text-stone-900 mb-4 md:mb-6 italic">Уклад Автономной Жизни</h2>
                    <p className="text-lg md:text-xl text-stone-700 leading-relaxed font-light">
                        Это про личную автономию и ремесло. Когда человек сам обеспечивает свои базовые нужды, 
                        он становится неуязвим для политических и экономических манипуляций.
                    </p>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8 items-stretch">
                    <div className="lg:col-span-4 bg-white p-6 md:p-8 rounded-3xl border border-stone-200 shadow-sm flex flex-col justify-between space-y-6 md:space-y-8">
                        <div className="space-y-8">
                            <h3 className="text-xs font-bold uppercase tracking-widest text-stone-400 font-sans">Личные настройки</h3>
                            <div className="space-y-8">
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <label className="text-sm font-bold text-stone-800 uppercase tracking-tighter font-sans">Личный Труд</label>
                                        <span className="text-xl italic text-stone-900">{laborHours} ч</span>
                                    </div>
                                    <input 
                                        type="range" min="1" max="16" step="1" value={laborHours}
                                        onChange={(e) => setLaborHours(parseInt(e.target.value, 10))}
                                        className="w-full h-2 bg-stone-100 rounded-lg appearance-none cursor-pointer accent-stone-900"
                                    />
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <label className="text-sm font-bold text-stone-800 uppercase tracking-tighter font-sans">Зависимость от рынка</label>
                                        <span className="text-xl italic text-stone-900">{consumptionLevel}%</span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="100" step="1" value={consumptionLevel}
                                        onChange={(e) => setConsumptionLevel(parseInt(e.target.value, 10))}
                                        className="w-full h-2 bg-stone-100 rounded-lg appearance-none cursor-pointer accent-stone-900"
                                    />
                                </div>
                            </div>
                        </div>
                        <div className="pt-6 border-t border-stone-100">
                            <div className="bg-stone-50 p-6 rounded-2xl border border-stone-200">
                                <p className="text-base md:text-lg text-stone-700 italic leading-relaxed">
                                    {getElderAnalysis()}
                                </p>
                                <p className="text-[10px] uppercase font-bold text-stone-400 mt-4 tracking-widest font-sans">— Мудрость Старостата</p>
                            </div>
                        </div>
                    </div>
                    <div className="lg:col-span-5 bg-stone-100 p-6 md:p-8 rounded-3xl border border-stone-200 flex flex-col items-center">
                        <h3 className="text-xs font-bold uppercase tracking-widest text-stone-400 mb-4 w-full text-left font-sans">Баланс Сил</h3>
                        <div className="w-full space-y-3">
                            {radarData.map((item) => (
                                <div key={item.subject} className="flex items-center gap-3">
                                    <div className="w-20 text-[11px] uppercase tracking-tight text-stone-500">{item.subject}</div>
                                    <div className="flex-1 h-2.5 rounded-full bg-stone-200 overflow-hidden">
                                        <div className="h-full" style={{ width: `${item.A}%`, backgroundColor: '#1c1917' }}></div>
                                    </div>
                                    <div className="w-12 text-right text-xs text-stone-600 font-mono">{item.A.toFixed(0)}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="lg:col-span-3 space-y-4 md:space-y-6">
                        <div className="bg-white p-6 rounded-3xl border border-stone-200 h-1/2 flex flex-col min-h-[160px]">
                            <h4 className="text-[10px] uppercase font-bold text-stone-400 mb-4 tracking-widest font-sans">Индекс Суверенитета</h4>
                            <div className="space-y-3">
                                {barData.map((entry) => (
                                    <div key={entry.name} className="flex items-center gap-3">
                                        <div className="w-14 text-[11px] uppercase tracking-tight text-stone-500">{entry.name}</div>
                                        <div className="flex-1 h-2.5 rounded-full bg-stone-200 overflow-hidden">
                                            <div className="h-full" style={{ width: `${entry['Зависимость']}%`, backgroundColor: entry.color }}></div>
                                        </div>
                                        <div className="w-10 text-right text-xs text-stone-600 font-mono">{entry['Зависимость']}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-stone-900 p-6 md:p-8 rounded-3xl h-1/2 flex flex-col justify-center text-stone-100 min-h-[160px]">
                            <p className="text-xl md:text-2xl italic leading-tight">
                                Твоё богатство — это не то, что ты <span className="text-stone-400">имеешь</span>, а то, в чем ты <span className="text-stone-400">не нуждаешься</span>.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const SettlementMapView = () => {
        const [selectedZone, setSelectedZone] = useState(null);
        const zones = [
            {
                id: 'council',
                name: 'Очаг Старейшин',

                                <div className="flex flex-col"><span className="text-4xl italic text-stone-900 font-bold">0%</span><span className="text-xs uppercase tracking-widest text-stone-500 font-bold mt-2 italic">Цифрового шума</span></div>
                                <div className="flex flex-col"><span className="text-4xl italic text-stone-900 font-bold">100%</span><span className="text-xs uppercase tracking-widest text-stone-500 font-bold mt-2 italic">Присутствия</span></div>
                                <div className="flex flex-col"><span className="text-4xl italic text-stone-900 font-bold">∞</span><span className="text-xs uppercase tracking-widest text-stone-500 font-bold mt-2 italic">Покоя</span></div>
                            </div>
                        </div>
                        <div className="w-full md:w-2/5 aspect-square bg-[#f5f2eb] rounded-full flex items-center justify-center p-12 border border-stone-300 shadow-inner relative group">
                            <div className="absolute inset-0 rounded-full border-4 border-dashed border-stone-200 animate-[spin_60s_linear_infinite]"></div>
                            <div className="text-center space-y-6 relative z-10">
                                <div className="text-7xl transition-transform duration-700 group-hover:scale-110">🌲</div>
                                <div className="space-y-2">
                                    <p className="text-xs uppercase font-bold tracking-[0.2em] text-stone-400 italic">Обрести покой</p>
                                    <p className="text-sm italic text-stone-600 leading-snug">
                                        "Ценность человека определяется его способностью возделывать сад вокруг себя."
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div className="max-w-3xl mx-auto py-12 border-t border-stone-200">
                    <div className="flex flex-col items-center text-center space-y-4">
                        <p className="text-stone-400 text-2xl">❧</p>
                        <p className="text-stone-500 italic text-lg md:text-xl leading-relaxed max-w-xl">
                            "Мы вернемся к естественному отбору, но не в джунглях, а на возделанном поле."
                        </p>
                        <p className="text-stone-300 text-sm tracking-[0.3em] font-bold pt-4 uppercase">Sapientia in Silentio</p>
                    </div>
                </div>
            </div>
        );
    };

    const App = () => {
        const [currentView, setCurrentView] = useState(View.INTRO);
        const renderContent = () => {
            switch (currentView) {
                case View.INTRO: return <Intro onNext={() => setCurrentView(View.CALHOUN)} />;
                case View.CALHOUN: return <CalhounView />;
                case View.DUNBAR: return <DunbarView />;
                case View.ECONOMY: return <EconomyView />;
                case View.MAP: return <SettlementMapView />;
                case View.TRANSITION: return <TransitionView />;
                case View.NATURE: return <NatureView />;
                case View.WISDOM: return <WisdomGallery />;
                default: return <Intro onNext={() => setCurrentView(View.CALHOUN)} />;
            }
        };
        return (
            <div className="min-h-screen flex flex-col parchment transition-colors duration-1000 pb-16 md:pb-0">
                <header className="py-4 md:py-6 px-6 md:px-8 border-b border-stone-200 flex flex-col md:flex-row justify-between items-center bg-stone-50/50 backdrop-blur-sm sticky top-0 z-40 gap-4 md:gap-0">
                    <div className="text-center md:text-left">
                        <h1 className="text-xl md:text-2xl font-bold tracking-tight text-stone-800 uppercase italic">Великий Исход</h1>
                        <p className="text-[10px] text-stone-500 uppercase tracking-widest">Автономия • Покой • Традиция</p>
                    </div>
                    <Navigation currentView={currentView} setView={setCurrentView} />
                </header>
                <main className="flex-1 flex flex-col container mx-auto px-4 py-8 md:py-12 max-w-5xl">
                    {renderContent()}
                </main>
                <footer className="py-8 px-8 border-t border-stone-200 text-center text-stone-400 text-xs md:text-sm mb-16 md:mb-0">
                    <p>© Старостат. Мудрость в тишине. 2025 – ∞</p>
                </footer>
            </div>
        );
    };

    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(
        <React.StrictMode>
            <App />
        </React.StrictMode>
    );
</script>
</body>
</html>
